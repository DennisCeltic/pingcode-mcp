  <text x="855" y="321" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">流程落地验证</text>
  <text x="855" y="341" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#64748B">确认各业务部门流程在系统中正常运转</text>

  <rect x="810" y="370" width="380" height="60" rx="8" fill="#F8FAFC"/>
  <text x="835" y="395" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#10B981">✓</text>
  <text x="855" y="396" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">培训完成确认</text>
  <text x="855" y="416" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#64748B">管理员和用户培训记录完整</text>

  <rect x="810" y="445" width="380" height="60" rx="8" fill="#F8FAFC"/>
  <text x="835" y="470" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#10B981">✓</text>
  <text x="855" y="471" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">文档交付确认</text>
  <text x="855" y="491" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#64748B">用户手册、使用规范、权限表完整交付</text>

  <rect x="810" y="520" width="380" height="60" rx="8" fill="#FEF9E7"/>
  <text x="835" y="545" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#F59E0B">○</text>
  <text x="855" y="546" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">签署服务验收单</text>
  <text x="855" y="566" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#64748B">需求发起人 + IT 共同确认签署</text>

  <!-- Milestone -->
  <rect x="810" y="600" width="380" height="60" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
  <text x="1000" y="628" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="800" fill="#059669" text-anchor="middle">🔷 里程碑: 项目验收通过</text>
  <text x="1000" y="650" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">目标: 2026年12月31日</text>
</svg>
