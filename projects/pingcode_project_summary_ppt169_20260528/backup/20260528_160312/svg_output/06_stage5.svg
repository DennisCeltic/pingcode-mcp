<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="headerAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="stage5Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="cardSh">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="1"/>
      <feFlood flood-color="#0F172A" flood-opacity="0.05"/>
      <feComposite operator="in" in2="SourceAlpha"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1280" height="5" fill="url(#headerAccent)"/>

  <text x="60" y="50" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif"
        font-size="28" font-weight="700" fill="#1E293B">阶段5: 跟踪验收</text>
  <text x="60" y="78" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif"
        font-size="15" fill="#64748B">6月30日 — 12月31日  ·  系统持续优化与正式验收</text>
  <text x="1220" y="50" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif"
        font-size="13" fill="#94A3B8" text-anchor="end">P06</text>

  <!-- Left: Problem tracking flow -->
  <rect x="60" y="120" width="700" height="560" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardSh)"/>
  <rect x="60" y="120" width="700" height="5" rx="2" fill="#EF4444"/>

  <text x="100" y="170" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">系统使用问题收集与持续优化</text>

  <!-- Flow: Collect -> Track -> Resolve -->
  <g>
    <rect x="100" y="200" width="180" height="80" rx="8" fill="#FEF2F2"/>
    <text x="190" y="235" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="600" fill="#DC2626" text-anchor="middle">问题收集</text>
    <text x="190" y="260" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">所有使用人员反馈</text>

    <polygon points="290,240 320,240 320,230 350,248 320,266 320,256 290,256" fill="#FCA5A5"/>

    <rect x="360" y="200" width="180" height="80" rx="8" fill="#FEF2F2"/>
    <text x="450" y="235" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="600" fill="#DC2626" text-anchor="middle">问题跟踪</text>
    <text x="450" y="260" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">整理分类 · 跟进进度</text>

    <polygon points="550,240 580,240 580,230 610,248 580,266 580,256 550,256" fill="#FCA5A5"/>

    <rect x="100" y="310" width="180" height="80" rx="8" fill="#ECFDF5"/>
    <text x="190" y="345" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="600" fill="#10B981" text-anchor="middle">优化实施</text>
    <text x="190" y="370" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">乙方持续优化系统</text>

    <polygon points="290,350 320,350 320,340 350,358 320,376 320,366 290,366" fill="#6EE7B7"/>

    <rect x="360" y="310" width="180" height="80" rx="8" fill="#ECFDF5"/>
    <text x="450" y="345" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="600" fill="#10B981" text-anchor="middle">效果验证</text>
    <text x="450" y="370" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">确认优化达到预期</text>
  </g>

  <rect x="100" y="425" width="620" height="1" fill="#E2E8F0"/>

  <text x="100" y="470" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="600" fill="#1E293B">关键角色</text>
  <g font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#64748B">
    <circle cx="115" cy="498" r="4" fill="#EF4444"/>
    <text x="130" y="503">需求发起人: 发起使用需求，参与验收</text>
    <circle cx="115" cy="525" r="4" fill="#F59E0B"/>
    <text x="130" y="530">IT: 系统维护与技术支持</text>
    <circle cx="115" cy="552" r="4" fill="#10B981"/>
    <text x="130" y="557">系统管理员: 日常管理与配置维护</text>
    <circle cx="115" cy="579" r="4" fill="#2563EB"/>
    <text x="130" y="584">所有使用人员: 反馈使用问题与建议</text>
  </g>

  <!-- Right: Acceptance checklist -->
  <rect x="780" y="120" width="440" height="560" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardSh)"/>
  <rect x="780" y="120" width="440" height="5" rx="2" fill="#10B981"/>

  <text x="820" y="170" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">项目交付验收</text>
  <text x="820" y="198" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#94A3B8">时间: 待定</text>

  <rect x="810" y="220" width="380" height="60" rx="8" fill="#F8FAFC"/>
  <text x="835" y="245" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#10B981">✓</text>
  <text x="855" y="246" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">系统功能验收</text>
  <text x="855" y="266" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#64748B">确认部署功能模块完全满足合同要求</text>

  <rect x="810" y="295" width="380" height="60" rx="8" fill="#F8FAFC"/>
